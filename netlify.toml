# Netlify — serves the CreatorForge AI web client (static).
# The API must live on Render/Railway/Fly (see DEPLOY.md) and its URL goes in VITE_API_URL.
[build]
  base = "client"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
